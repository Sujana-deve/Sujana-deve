<svg width="100%" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320">
    <stop stop-color="#05010D"/>
    <stop offset="0.45" stop-color="#100022"/>
    <stop offset="1" stop-color="#001B2E"/>
  </linearGradient>

  <linearGradient id="title" x1="180" y1="80" x2="1000" y2="210">
    <stop stop-color="#00F5FF"/>
    <stop offset="0.45" stop-color="#8B5CF6"/>
    <stop offset="0.75" stop-color="#EC4899"/>
    <stop offset="1" stop-color="#00F5FF">
      <animate attributeName="stop-color"
        values="#00F5FF;#EC4899;#8B5CF6;#00F5FF"
        dur="6s"
        repeatCount="indefinite"/>
    </stop>
  </linearGradient>

  <radialGradient id="purpleGlow">
    <stop stop-color="#8B5CF6" stop-opacity="0.45"/>
    <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
  </radialGradient>

  <radialGradient id="cyanGlow">
    <stop stop-color="#00F5FF" stop-opacity="0.3"/>
    <stop offset="1" stop-color="#00F5FF" stop-opacity="0"/>
  </radialGradient>

  <filter id="blur">
    <feGaussianBlur stdDeviation="30"/>
  </filter>

  <filter id="smallBlur">
    <feGaussianBlur stdDeviation="8"/>
  </filter>

  <filter id="glow">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" stroke="#8B5CF6" stroke-opacity="0.08"/>
  </pattern>

</defs>

<!-- BACKGROUND -->

<rect width="1200" height="320" rx="26" fill="url(#bg)"/>
<rect width="1200" height="320" rx="26" fill="url(#grid)"/>

<!-- AMBIENT GLOW -->

<circle cx="120" cy="90" r="170" fill="url(#purpleGlow)" filter="url(#blur)">
  <animate attributeName="cx"
    values="120;1080;120"
    dur="14s"
    repeatCount="indefinite"/>
</circle>

<circle cx="1050" cy="250" r="150" fill="url(#cyanGlow)" filter="url(#blur)">
  <animate attributeName="cy"
    values="250;80;250"
    dur="10s"
    repeatCount="indefinite"/>
</circle>

<!-- STARS -->

<g fill="#fff">

  <circle cx="80" cy="55" r="1.5">
    <animate attributeName="opacity"
      values="0.2;1;0.2"
      dur="2s"
      repeatCount="indefinite"/>
  </circle>

  <circle cx="190" cy="250" r="1">
    <animate attributeName="opacity"
      values="1;0.2;1"
      dur="3s"
      repeatCount="indefinite"/>
  </circle>

  <circle cx="1020" cy="70" r="1.5">
    <animate attributeName="opacity"
      values="0.2;1;0.2"
      dur="2.4s"
      repeatCount="indefinite"/>
  </circle>

  <circle cx="1120" cy="210" r="1">
    <animate attributeName="opacity"
      values="1;0.2;1"
      dur="2.8s"
      repeatCount="indefinite"/>
  </circle>

  <circle cx="920" cy="40" r="1">
    <animate attributeName="opacity"
      values="0.2;1;0.2"
      dur="1.8s"
      repeatCount="indefinite"/>
  </circle>

</g>

<!-- ORBIT -->

<ellipse
cx="600"
cy="160"
rx="470"
ry="115"
stroke="#8B5CF6"
stroke-opacity="0.2"
stroke-width="1"
stroke-dasharray="5 14">

<animateTransform
 attributeName="transform"
 type="rotate"
 from="0 600 160"
 to="360 600 160"
 dur="22s"
 repeatCount="indefinite"/>

</ellipse>

<!-- ORBITING DOT -->

<circle cx="1070" cy="160" r="5" fill="#00F5FF" filter="url(#glow)">
  <animateTransform
    attributeName="transform"
    type="rotate"
    from="0 600 160"
    to="360 600 160"
    dur="22s"
    repeatCount="indefinite"/>
</circle>

<!-- TOP LABEL -->

<text
x="600"
y="72"
text-anchor="middle"
font-family="monospace"
font-size="13"
letter-spacing="5"
fill="#94A3B8">
FULL-STACK DEVELOPER </text>

<!-- NAME -->

<text
x="600"
y="145"
text-anchor="middle"
font-family="Arial, Helvetica, sans-serif"
font-size="64"
font-weight="800"
letter-spacing="2"
fill="url(#title)"
filter="url(#glow)">
SUJANA SHARMA </text>

<!-- SUBTITLE -->

<text
x="600"
y="182"
text-anchor="middle"
font-family="monospace"
font-size="14"
letter-spacing="2"
fill="#CBD5E1">
PYTHON • DJANGO • REACT • AUTOMATION </text>

<!-- TERMINAL -->

<rect
x="385"
y="215"
width="430"
height="42"
rx="10"
fill="#05010D"
fill-opacity="0.8"
stroke="#8B5CF6"
stroke-opacity="0.35"/>

<circle cx="407" cy="236" r="4" fill="#EC4899"/>
<circle cx="421" cy="236" r="4" fill="#8B5CF6"/>
<circle cx="435" cy="236" r="4" fill="#00F5FF"/>

<text
x="455"
y="241"
font-family="monospace"
font-size="12"
fill="#64748B">
building things that started as "just a script" </text>

<!-- BOTTOM LINE -->

<rect x="480" y="282" width="240" height="1" fill="#8B5CF6">
  <animate attributeName="width"
    values="80;240;80"
    dur="4s"
    repeatCount="indefinite"/>

<animate attributeName="x"
 values="560;480;560"
 dur="4s"
 repeatCount="indefinite"/> </rect>

</svg>
