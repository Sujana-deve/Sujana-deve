<svg width="100%" height="170" viewBox="0 0 1200 170" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="footerGradient" x1="0" y1="0" x2="1200" y2="0">
  <stop stop-color="#00F5FF"/>
  <stop offset="0.5" stop-color="#8B5CF6"/>
  <stop offset="1" stop-color="#EC4899"/>
</linearGradient>

<filter id="glow">
  <feGaussianBlur stdDeviation="3" result="blur"/>
  <feMerge>
    <feMergeNode in="blur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

</defs>

<rect
x="2"
y="2"
width="1196"
height="166"
rx="24"
fill="#05010D"
stroke="url(#footerGradient)"
stroke-opacity="0.3"/>

<text
x="600"
y="65"
text-anchor="middle"
font-family="Arial, sans-serif"
font-size="28"
font-weight="700"
fill="url(#footerGradient)"
filter="url(#glow)">
KEEP BUILDING. </text>

<text
x="600"
y="95"
text-anchor="middle"
font-family="monospace"
font-size="12"
fill="#64748B">
build • break • debug • learn • repeat </text>

<line
x1="440"
y1="120"
x2="760"
y2="120"
stroke="url(#footerGradient)"
stroke-opacity="0.5">

<animate
 attributeName="x1"
 values="540;440;540"
 dur="4s"
 repeatCount="indefinite"/>

<animate
 attributeName="x2"
 values="660;760;660"
 dur="4s"
 repeatCount="indefinite"/>

</line>

<text
x="600"
y="145"
text-anchor="middle"
font-family="monospace"
font-size="10"
fill="#475569">
SUJANA SHARMA • 2026 </text>

</svg>
