<svg width="100%" height="170" viewBox="0 0 1200 170" fill="none" xmlns="http://www.w3.org/2000/svg">

<rect width="1200" height="170" rx="4" fill="#F6F3ED"/>
<rect x="0.5" y="0.5" width="1199" height="169" fill="none" stroke="#2B2A26" stroke-opacity="0.08"/>

<circle cx="600.0" cy="45" r="3" fill="#C99B6B" opacity="0">
  <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.2;1" dur="1.2s" fill="freeze"/>
  <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="4s" begin="1.2s" repeatCount="indefinite"/>
</circle>

<text x="600.0" y="90" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="500" fill="#2B2A26" opacity="0">
  <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.3;1" dur="1.6s" fill="freeze"/>
  Thanks for stopping by
</text>

<line x1="570.0" y1="105" x2="570.0" y2="105" stroke="#8C9E82" stroke-width="1.5">
  <animate attributeName="x2" values="570.0;570.0;630.0" keyTimes="0;0.55;1" dur="2.1s" fill="freeze"/>
</line>

<text x="600.0" y="132" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#948F82" opacity="0">
  <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.75;1" dur="2.6s" fill="freeze"/>
  open to work — links above
</text>

</svg>
