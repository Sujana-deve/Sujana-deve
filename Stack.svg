<svg width="100%" height="260" viewBox="0 0 1000 260" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="border" x1="0" y1="0" x2="1000" y2="260">
  <stop stop-color="#00F5FF"/>
  <stop offset="0.5" stop-color="#8B5CF6"/>
  <stop offset="1" stop-color="#EC4899"/>
</linearGradient>

<filter id="glow">
  <feGaussianBlur stdDeviation="3" result="blur"/>
  <feMerge>
    <feMergeNode in="blur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

<radialGradient id="core">
  <stop stop-color="#8B5CF6" stop-opacity="0.4"/>
  <stop offset="1" stop-color="#080014" stop-opacity="0"/>
</radialGradient>

</defs>

<!-- CARD -->

<rect
x="2"
y="2"
width="996"
height="256"
rx="24"
fill="#080014"
stroke="url(#border)"
stroke-opacity="0.35"/>

<!-- GLOW -->

<circle cx="500" cy="130" r="100" fill="url(#core)">
  <animate attributeName="r"
    values="70;120;70"
    dur="5s"
    repeatCount="indefinite"/>
</circle>

<!-- CENTER -->

<circle
cx="500"
cy="130"
r="54"
fill="#100021"
stroke="#8B5CF6"
stroke-width="2"
filter="url(#glow)"/>

<text
x="500"
y="126"
text-anchor="middle"
font-family="monospace"
font-size="15"
font-weight="bold"
fill="#fff">
PYTHON </text>

<text
x="500"
y="146"
text-anchor="middle"
font-family="monospace"
font-size="9"
fill="#64748B">
CORE </text>

<!-- ORBIT -->

<ellipse
cx="500"
cy="130"
rx="340"
ry="88"
fill="none"
stroke="#8B5CF6"
stroke-opacity="0.25"
stroke-dasharray="4 12">

<animateTransform
 attributeName="transform"
 type="rotate"
 from="0 500 130"
 to="360 500 130"
 dur="18s"
 repeatCount="indefinite"/> </ellipse>

<!-- NODES -->

<g font-family="monospace" font-size="11" text-anchor="middle">

<!-- DJANGO -->

<circle cx="190" cy="130" r="34" fill="#0D0618" stroke="#00F5FF"/>
<text x="190" y="134" fill="#00F5FF">DJANGO</text>

<!-- REACT -->

<circle cx="300" cy="55" r="34" fill="#0D0618" stroke="#61DAFB"/>
<text x="300" y="59" fill="#61DAFB">REACT</text>

<!-- JAVASCRIPT -->

<circle cx="700" cy="55" r="34" fill="#0D0618" stroke="#F7DF1E"/>
<text x="700" y="59" fill="#F7DF1E">JS</text>

<!-- PANDAS -->

<circle cx="810" cy="130" r="34" fill="#0D0618" stroke="#EC4899"/>
<text x="810" y="134" fill="#EC4899">PANDAS</text>

<!-- POSTGRES -->

<circle cx="700" cy="205" r="34" fill="#0D0618" stroke="#38BDF8"/>
<text x="700" y="209" fill="#38BDF8">SQL</text>

<!-- PLAYWRIGHT -->

<circle cx="300" cy="205" r="34" fill="#0D0618" stroke="#4ADE80"/>
<text x="300" y="209" fill="#4ADE80">PLAYWRIGHT</text>

</g>

<!-- CONNECTIONS -->

<g stroke="#8B5CF6" stroke-opacity="0.2">
<line x1="224" y1="130" x2="446" y2="130"/>
<line x1="328" y1="68" x2="458" y2="108"/>
<line x1="672" y1="68" x2="542" y2="108"/>
<line x1="776" y1="130" x2="554" y2="130"/>
<line x1="672" y1="192" x2="542" y2="152"/>
<line x1="328" y1="192" x2="458" y2="152"/>
</g>

</svg>
