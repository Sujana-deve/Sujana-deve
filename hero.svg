<svg width="100%" height="340" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>
  <clipPath id="revealName">
    <rect x="85" y="115" width="0" height="90">
      <animate attributeName="width" values="0;0;700" keyTimes="0;0.15;1" dur="1.4s" fill="freeze"/>
    </rect>
  </clipPath>
</defs>

<rect width="1200" height="340" rx="4" fill="#F6F3ED"/>

<!-- faint hairline border -->
<rect x="0.5" y="0.5" width="1199" height="339" fill="none" stroke="#2B2A26" stroke-opacity="0.08"/>

<!-- floating dot, gentle bob -->
<circle cx="1060" cy="90" r="5" fill="#C99B6B" opacity="0.8">
  <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="4.5s" repeatCount="indefinite"/>
</circle>
<circle cx="1105" cy="150" r="3" fill="#8C9E82" opacity="0.6">
  <animateTransform attributeName="transform" type="translate" values="0 0;0 8;0 0" dur="5.5s" repeatCount="indefinite"/>
</circle>
<circle cx="1020" cy="200" r="2.5" fill="#2B2A26" opacity="0.15">
  <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="6s" repeatCount="indefinite"/>
</circle>

<!-- thin decorative ring, slow rotate -->
<g transform="translate(1060 150)" opacity="0.35">
  <circle r="60" fill="none" stroke="#8C9E82" stroke-width="1"/>
  <circle r="60" fill="none" stroke="#C99B6B" stroke-width="1" stroke-dasharray="2 10">
    <animateTransform attributeName="transform" type="rotate" values="0;360" dur="40s" repeatCount="indefinite"/>
  </circle>
</g>

<!-- eyebrow label -->
<text x="90" y="110" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="4" fill="#948F82" opacity="0">
  <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.05;1" dur="1.1s" fill="freeze"/>
  COMPUTER ENGINEERING · WEB DEVELOPER
</text>

<!-- name, soft reveal -->
<g clip-path="url(#revealName)">
  <text x="88" y="180" font-family="Helvetica, Arial, sans-serif" font-size="64" font-weight="300" letter-spacing="1" fill="#2B2A26">Sujana Sharma</text>
</g>

<!-- animated underline draw -->
<line x1="90" y1="200" x2="90" y2="200" stroke="#8C9E82" stroke-width="2">
  <animate attributeName="x2" values="90;90;430" keyTimes="0;0.5;1" dur="1.9s" fill="freeze"/>
</line>

<!-- subtitle -->
<text x="90" y="240" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#948F82" opacity="0">
  <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.65;1" dur="2.4s" fill="freeze"/>
  Django &amp; React developer, based in Pokhara, Nepal
</text>

<!-- small tags, gentle fade -->
<g font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2B2A26" opacity="0">
  <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.78;1" dur="2.9s" fill="freeze"/>
  <text x="90" y="280">Python</text>
  <text x="160" y="280" fill="#948F82">·</text>
  <text x="175" y="280">Django</text>
  <text x="245" y="280" fill="#948F82">·</text>
  <text x="260" y="280">React</text>
  <text x="320" y="280" fill="#948F82">·</text>
  <text x="335" y="280">PostgreSQL</text>
</g>

</svg>
