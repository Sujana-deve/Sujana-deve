<svg xmlns="http://www.w3.org/2000/svg" width="800" height="140" viewBox="0 0 800 140" role="img" aria-labelledby="t">
  <title id="t">Sujana Sharma, Python developer</title>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .n { font-size: 40px; font-weight: 700; fill: #1f2328; animation: in .8s ease-out both; }
    .t { font-size: 16px; fill: #656d76; }
    .a { fill: #0a7d5a; }
    .l { stroke: #0a7d5a; stroke-width: 2; stroke-dasharray: 120; animation: draw .8s .6s ease-out both; }
    .k { animation: type 1.6s 1.4s steps(51) forwards; }
    .c { animation: move 1.6s 1.4s steps(51) both, blink 1s 3s step-end infinite; }
    @keyframes in { from { opacity: 0; transform: translateY(8px); } }
    @keyframes draw { from { stroke-dashoffset: 120; } to { stroke-dashoffset: 0; } }
    @keyframes type { from { width: 0; } to { width: 480px; } }
    @keyframes move { from { transform: translateX(0); } to { transform: translateX(480px); } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-color-scheme: dark) {
      .n { fill: #e6edf3; }
      .t { fill: #8b949e; }
      .a { fill: #3fb950; }
      .l { stroke: #3fb950; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .k { width: 480px; }
      .c { opacity: 0; }
    }
  </style>
  <defs>
    <clipPath id="k"><rect class="k" x="40" y="86" width="0" height="30"/></clipPath>
  </defs>
  <text class="n" x="40" y="62">Sujana Sharma</text>
  <line class="l" x1="40" y1="76" x2="160" y2="76"/>
  <text class="t" x="40" y="106" textLength="480" lengthAdjust="spacingAndGlyphs" clip-path="url(#k)">Python developer. Building automation and web apps.</text>
  <rect class="c a" x="40" y="92" width="9" height="18"/>
</svg>
