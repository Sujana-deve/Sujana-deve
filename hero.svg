<svg width="100%" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

  <!-- CHROME -->

  <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset="0.18" stop-color="#A8A8A8"/>
    <stop offset="0.34" stop-color="#FFFFFF"/>
    <stop offset="0.52" stop-color="#666666"/>
    <stop offset="0.7" stop-color="#F5F5F5"/>
    <stop offset="1" stop-color="#777777"/>
  </linearGradient>

  <!-- PINK -->

  <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#FFB6E6"/>
    <stop offset="0.3" stop-color="#FF4FB3"/>
    <stop offset="0.65" stop-color="#FF008C"/>
    <stop offset="1" stop-color="#FF4FB3"/>
  </linearGradient>

  <!-- BACKGROUND -->

  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360">
    <stop stop-color="#090609"/>
    <stop offset="0.5" stop-color="#140910"/>
    <stop offset="1" stop-color="#050505"/>
  </linearGradient>

  <!-- GLOW -->

  <filter id="pinkGlow">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="softGlow">
    <feGaussianBlur stdDeviation="20"/>
  </filter>

  <!-- GRID -->

  <pattern id="grid" width="35" height="35" patternUnits="userSpaceOnUse">
    <path
      d="M35 0H0V35"
      stroke="#FF008C"
      stroke-opacity="0.07"
      stroke-width="1"/>
  </pattern>

  <!-- GRAIN -->

  <filter id="grain">
    <feTurbulence
      type="fractalNoise"
      baseFrequency="0.9"
      numOctaves="3"
      stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncA type="table" tableValues="0 0.07"/>
    </feComponentTransfer>
  </filter>

</defs>

<!-- BACKGROUND -->

<rect width="1200" height="360" rx="26" fill="url(#bg)"/>
<rect width="1200" height="360" rx="26" fill="url(#grid)"/>

<!-- PINK AMBIENT LIGHT -->

<circle
cx="170"
cy="100"
r="150"
fill="#FF008C"
opacity="0.12"
filter="url(#softGlow)">

<animate
 attributeName="cx"
 values="170;1030;170"
 dur="12s"
 repeatCount="indefinite"/>

</circle>

<!-- TOP BAR -->

<rect
x="35"
y="28"
width="1130"
height="34"
rx="8"
fill="#111111"
stroke="#FFFFFF"
stroke-opacity="0.15"/>

<circle cx="55" cy="45" r="5" fill="#FF008C"/>
<circle cx="72" cy="45" r="5" fill="#FFFFFF"/>
<circle cx="89" cy="45" r="5" fill="#777777"/>

<text
x="110"
y="50"
font-family="monospace"
font-size="11"
letter-spacing="2"
fill="#999999">
SUJANA_OS // PERSONAL_INTERFACE </text>

<text
x="1125"
y="50"
text-anchor="end"
font-family="monospace"
font-size="10"
fill="#FF4FB3">
ONLINE ● </text>

<!-- STAR FIELD -->

<g fill="#FFFFFF">

<circle cx="110" cy="110" r="2">
  <animate attributeName="opacity"
    values=".2;1;.2"
    dur="2s"
    repeatCount="indefinite"/>
</circle>

<circle cx="1080" cy="95" r="1.5">
  <animate attributeName="opacity"
    values="1;.2;1"
    dur="2.5s"
    repeatCount="indefinite"/>
</circle>

<circle cx="1010" cy="280" r="2">
  <animate attributeName="opacity"
    values=".2;1;.2"
    dur="1.8s"
    repeatCount="indefinite"/>
</circle>

<circle cx="150" cy="280" r="1.5">
  <animate attributeName="opacity"
    values="1;.2;1"
    dur="3s"
    repeatCount="indefinite"/>
</circle>

</g>

<!-- DECORATIVE CD -->

<g transform="translate(1030 175)">

  <circle r="76" fill="#111111" stroke="#888888" stroke-width="2"/>

<circle r="62"
 fill="none"
 stroke="url(#chrome)"
 stroke-width="10"
 opacity="0.8"/>

<circle r="42"
 fill="none"
 stroke="#FF008C"
 stroke-opacity="0.7"
 stroke-width="2"/>

<circle r="14"
 fill="#111111"
 stroke="#FFFFFF"
 stroke-opacity="0.7"/>

  <circle r="4" fill="#FF008C"/>

<animateTransform
 attributeName="transform"
 type="rotate"
 from="0 0 0"
 to="360 0 0"
 dur="12s"
 repeatCount="indefinite"/>

</g>

<!-- SMALL SPARKLES -->

<g fill="#FF4FB3" filter="url(#pinkGlow)">

  <path d="M945 110 L949 122 L961 126 L949 130 L945 142 L941 130 L929 126 L941 122Z"/>

  <path d="M235 185 L238 194 L247 197 L238 200 L235 209 L232 200 L223 197 L232 194Z"/>

</g>

<!-- MAIN LABEL -->

<text
x="600"
y="112"
text-anchor="middle"
font-family="monospace"
font-size="12"
letter-spacing="6"
fill="#FF4FB3">
✦ WELCOME TO MY CORNER OF THE INTERNET ✦ </text>

<!-- NAME -->

<text
x="600"
y="180"
text-anchor="middle"
font-family="Arial, Helvetica, sans-serif"
font-size="68"
font-weight="900"
letter-spacing="3"
fill="url(#chrome)"
stroke="#FFFFFF"
stroke-opacity="0.25"
filter="url(#pinkGlow)">
SUJANA </text>

<text
x="600"
y="222"
text-anchor="middle"
font-family="Arial, Helvetica, sans-serif"
font-size="30"
font-weight="800"
letter-spacing="9"
fill="#FF4FB3">
SHARMA </text>

<!-- TERMINAL -->

<rect
x="390"
y="250"
width="420"
height="40"
rx="8"
fill="#090909"
stroke="#FF008C"
stroke-opacity="0.5"/>

<text
x="415"
y="275"
font-family="monospace"
font-size="12"
fill="#777777">
> </text>

<text
x="435"
y="275"
font-family="monospace"
font-size="12"
fill="#FFFFFF">
full-stack developer_ </text>

<!-- BLINKING CURSOR -->

<rect
x="600"
y="263"
width="7"
height="15"
fill="#FF008C">

<animate
 attributeName="opacity"
 values="1;0;1"
 dur="0.8s"
 repeatCount="indefinite"/>

</rect>

<!-- BOTTOM DECOR -->

<line
x1="320"
y1="325"
x2="880"
y2="325"
stroke="url(#pink)"
stroke-width="1"/>

<circle cx="320" cy="325" r="4" fill="#FF008C"/>
<circle cx="880" cy="325" r="4" fill="#FF008C"/>

<rect width="1200" height="360" rx="26" filter="url(#grain)" opacity="0.15"/>

</svg>
