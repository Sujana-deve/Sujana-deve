<svg width="100%" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
  <stop stop-color="#FFFFFF"/>
  <stop offset="0.3" stop-color="#777777"/>
  <stop offset="0.5" stop-color="#FFFFFF"/>
  <stop offset="0.7" stop-color="#555555"/>
  <stop offset="1" stop-color="#EEEEEE"/>
</linearGradient>

<filter id="glow">
  <feGaussianBlur stdDeviation="4" result="blur"/>
  <feMerge>
    <feMergeNode in="blur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

</defs>

<!-- CARD -->

<rect
x="3"
y="3"
width="1194"
height="294"
rx="24"
fill="#0B080A"
stroke="#FF008C"
stroke-opacity="0.35"/>

<!-- HEADER -->

<text
x="45"
y="48"
font-family="monospace"
font-size="11"
letter-spacing="3"
fill="#FF4FB3">
SYSTEM://TECH_STACK </text>

<text
x="1150"
y="48"
text-anchor="end"
font-family="monospace"
font-size="10"
fill="#666666">
v2.026 </text>

<!-- CENTRAL CD -->

<g transform="translate(600 150)">

<circle r="72"
fill="#111111"
stroke="#777777"
stroke-width="2"/>

<circle r="58"
fill="none"
stroke="url(#chrome)"
stroke-width="9"/>

<circle r="42"
fill="none"
stroke="#FF008C"
stroke-width="2"
stroke-opacity="0.7"/>

<circle r="15"
fill="#090909"
stroke="#FFFFFF"
stroke-opacity="0.5"/>

<circle r="4" fill="#FF008C" filter="url(#glow)"/>

<animateTransform
attributeName="transform"
type="rotate"
from="0 0 0"
to="360 0 0"
dur="15s"
repeatCount="indefinite"/>

</g>

<!-- CONNECTING LINES -->

<g stroke="#FF008C" stroke-opacity="0.35">

<line x1="190" y1="105" x2="535" y2="145"/>
<line x1="330" y1="225" x2="545" y2="170"/>
<line x1="1010" y1="105" x2="665" y2="145"/>
<line x1="870" y1="225" x2="655" y2="170"/>

</g>

<!-- TECH LABELS -->

<g font-family="monospace">

<!-- DJANGO -->

<rect x="80" y="78" width="220" height="55" rx="10"
fill="#111111" stroke="#555555"/>

<text x="100" y="101" fill="#FF4FB3" font-size="11">
BACKEND
</text>

<text x="100" y="120" fill="url(#chrome)" font-size="14">
DJANGO / DRF
</text>

<!-- PYTHON -->

<rect x="80" y="195" width="220" height="55" rx="10"
fill="#111111" stroke="#555555"/>

<text x="100" y="218" fill="#FF4FB3" font-size="11">
LANGUAGE
</text>

<text x="100" y="237" fill="url(#chrome)" font-size="14">
PYTHON
</text>

<!-- FRONTEND -->

<rect x="900" y="78" width="220" height="55" rx="10"
fill="#111111" stroke="#555555"/>

<text x="920" y="101" fill="#FF4FB3" font-size="11">
FRONTEND
</text>

<text x="920" y="120" fill="url(#chrome)" font-size="14">
REACT / VITE
</text>

<!-- DATA -->

<rect x="900" y="195" width="220" height="55" rx="10"
fill="#111111" stroke="#555555"/>

<text x="920" y="218" fill="#FF4FB3" font-size="11">
DATA / AUTOMATION
</text>

<text x="920" y="237" fill="url(#chrome)" font-size="14">
PANDAS / PLAYWRIGHT
</text>

</g>

<!-- SCAN -->

<rect x="20" y="150" width="1160" height="1"
fill="#FF008C"
opacity="0.15">

<animate
attributeName="y"
values="70;270;70"
dur="4s"
repeatCount="indefinite"/>

</rect>

</svg>
