<svg width="100%" height="390" viewBox="0 0 1200 390" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

  <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset="0.22" stop-color="#A5A5A5"/>
    <stop offset="0.42" stop-color="#FFFFFF"/>
    <stop offset="0.62" stop-color="#666666"/>
    <stop offset="0.82" stop-color="#EDEDED"/>
    <stop offset="1" stop-color="#777777"/>
  </linearGradient>

  <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#FFB5E5"/>
    <stop offset="0.45" stop-color="#FF3EAC"/>
    <stop offset="1" stop-color="#FF008C"/>
  </linearGradient>

  <filter id="pinkGlow">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="softGlow">
    <feGaussianBlur stdDeviation="18"/>
  </filter>

</defs>

