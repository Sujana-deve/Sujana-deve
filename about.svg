<svg width="100%" height="408" viewBox="0 0 1270 408" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

  <!-- Chrome text -->
  <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset="0.25" stop-color="#A8A8A8"/>
    <stop offset="0.45" stop-color="#FFFFFF"/>
    <stop offset="0.68" stop-color="#777777"/>
    <stop offset="0.84" stop-color="#EEEEEE"/>
    <stop offset="1" stop-color="#8A8A8A"/>
  </linearGradient>

  <!-- Pink -->
  <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#8CFFCE"/>
    <stop offset="0.45" stop-color="#00E5FF"/>
    <stop offset="1" stop-color="#00FF9C"/>
  </linearGradient>

  <!-- Very subtle background -->
  <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
    <path
      d="M18 0H0V18"
      stroke="#292126"
      stroke-width="0.7"
      opacity="0.42"/>
  </pattern>

  <!-- Pink glow -->
  <filter id="pinkGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3.5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

</defs>


